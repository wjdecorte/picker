name: picker
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: picker
      POSTGRES_USER: picker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picker -d picker"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    image: ${PICKER_IMAGE:-ghcr.io/wjdecorte/picker:latest}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://picker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/picker
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8756}
      ALLOW_LAN_ACCESS: "true"
      CHATGPT_AUTH_DIR: /app/private/chatgpt
      CHATGPT_CALLBACK_PORT: ${CHATGPT_CALLBACK_PORT:-8757}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      RESULTS_SERVICE_KEY: ${RESULTS_SERVICE_KEY:-}
    volumes:
      - chatgpt_auth:/app/private
    ports:
      - "${APP_PORT:-8756}:3000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres_data:
  chatgpt_auth:
